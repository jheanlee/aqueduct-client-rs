[package]
name = "aqueduct-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
dotenv = "0.15.0"
futures = "0.3.33"
hmac = "0.13.0"
regex = "1.12.4"
rustls = "0.23.43"
rustls-native-certs = "0.8.4"
rustyline = "17.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "rt-multi-thread", "io-util", "time", "signal"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.19", features = ["join-map", "rt", "codec"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.12.1"
